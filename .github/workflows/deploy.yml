
name: Deploy React

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Test Image
        run: docker build -t react-test -f Dockerfile.dev .

      - name: Run Tests
        run: docker run --rm -e CI=true react-test npm run test -- --watchAll=false

      - name: Build Production Image
        run: docker build -t alan0o0s/react-test:latest -f Dockerfile .

      - name: Push Image to Docker Hub
        run: docker push alan0o0s/react-test:latest

      - name: Create Deployment Package
        run: |
          cat > Dockerrun.aws.json <<'EOF'
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "alan0o0s/react-test:latest",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": "80"
              }
            ]
          }
          EOF

          zip deploy.zip Dockerrun.aws.json

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: react-project
          environment_name: React-project-env
          region: us-east-1
          version_label: react-${{ github.run_number }}
          deployment_package: deploy.zip
