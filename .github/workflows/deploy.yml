
name: Deploy React

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t alan0o0s/react-test:latest -f Dockerfile.dev .

      - name: Run tests
        run: docker run -e CI=true alan0o0s/react-test:latest npm run test

      - name: Push image to Docker Hub
        if: success()
        run: docker push alan0o0s/react-test:latest
